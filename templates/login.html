<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></div>
        <div class="nav-links">
            <a href="/">Analyze</a>
            <a href="/register-page">Create Account</a>
        </div>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-brain"></i>
            <h2>Welcome Back</h2>
            <p>Sign in to access your analysis history</p>
        </div>

        <div id="errorMessage" style="display:none;background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius-md);font-size:0.875rem;margin-bottom:16px;border-left:3px solid var(--danger);"></div>

        <form id="loginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
            </div>
            <button class="btn-primary btn-large" type="submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--slate-light);">
            Don't have an account? <a href="/register-page" style="color:var(--gold);font-weight:600;">Create one free</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('errorMessage');
    errorEl.style.display = 'none';

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/';
        } else {
            errorEl.textContent = data.error || 'Login failed.';
            errorEl.style.display = 'block';
        }
    } catch {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
    }
});
</script>
</body>
</html>
