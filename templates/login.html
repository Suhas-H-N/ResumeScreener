<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="login" style="background:var(--ivory);display:flex;flex-direction:column;min-height:100vh;">
<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></a>
    <div class="nav-links">
      <a href="/signup-page" class="btn-primary">Create Account</a>
    </div>
  </div>
</nav>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;">
  <div class="auth-card" style="width:100%;max-width:420px;background:white;border:1px solid var(--border-soft);border-radius:var(--radius-xl);padding:2.5rem 2rem;box-shadow:var(--shadow-lg);">
    <div style="text-align:center;margin-bottom:1.75rem;">
      <div style="width:52px;height:52px;background:linear-gradient(135deg,var(--navy),var(--navy-soft));border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;"><i class="fas fa-brain" style="color:var(--gold-light);font-size:1.3rem;"></i></div>
      <h1 style="font-size:1.5rem;font-weight:700;">Welcome back</h1>
      <p style="color:var(--slate-light);font-size:0.875rem;margin-top:4px;">Sign in to access your analyses and job tracker</p>
    </div>
    <form id="loginForm">
      <div class="field-group">
        <label class="field-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.25rem;padding:12px;">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    <div style="text-align:center;margin-top:1rem;">
      <button id="forgotBtn" style="background:none;border:none;color:var(--slate-light);font-size:0.8125rem;cursor:pointer;text-decoration:underline;">Forgot password?</button>
    </div>
    <div style="text-align:center;margin-top:1.5rem;font-size:0.875rem;color:var(--slate-light);border-top:1px solid var(--border-soft);padding-top:1.25rem;">
      Don't have an account? <a href="/signup-page" style="font-weight:700;color:var(--navy);">Create one free</a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
