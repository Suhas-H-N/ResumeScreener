<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis History - ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
        }
        .history-table th {
            background: var(--gray-100);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--gray-200);
        }
        .history-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }
        .history-table tr:hover {
            background: var(--gray-100);
        }
        .score-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .score-excellent { background: #d1fae5; color: #065f46; }
        .score-good { background: #fef3c7; color: #92400e; }
        .score-average { background: #fed7aa; color: #7c2d12; }
        .score-low { background: #fee2e2; color: #991b1b; }
        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }
        .btn-icon {
            padding: 0.5rem;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: background 0.2s;
        }
        .btn-icon:hover {
            background: var(--gray-200);
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-state i {
            font-size: 4rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navigation (reuse from index.html) -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <i class="fas fa-brain"></i>
                <span>ResumeIQ Pro</span>
            </div>
            <div class="nav-links">
                <a href="/">Analyze</a>
                <a href="/compare-page">Compare</a>
                <a href="/history-page" class="active">History</a>
                <a href="/login-page" class="btn-primary" id="loginLink">Login</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="card">
                <div class="history-header">
                    <h2><i class="fas fa-history"></i> Analysis History</h2>
                    <button class="btn-secondary" id="exportBtn">
                        <i class="fas fa-download"></i> Export CSV
                    </button>
                </div>

                <div id="historyContent">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ResumeIQ Pro. Enhanced with Claude AI.</p>
            </div>
        </div>
    </footer>

    <script>
        let historyData = [];

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load history');
                }

                historyData = data.analyses;
                displayHistory(historyData);
            } catch (error) {
                console.error('Load history error:', error);
                document.getElementById('historyContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Please <a href="/login-page">login</a> to view your history</p>
                    </div>
                `;
            }
        }

        function displayHistory(analyses) {
            const container = document.getElementById('historyContent');

            if (!analyses || analyses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>No analysis history yet</p>
                        <a href="/" class="btn-primary" style="margin-top: 1rem;">Start Analyzing</a>
                    </div>
                `;
                return;
            }

            const table = `
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Job Title</th>
                            <th>Match Score</th>
                            <th>ATS Score</th>
                            <th>Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${analyses.map(a => `
                            <tr>
                                <td>${new Date(a.date).toLocaleDateString()}</td>
                                <td>${a.job_title || 'N/A'}</td>
                                <td><strong>${a.match_score}%</strong></td>
                                <td><strong>${a.ats_score}%</strong></td>
                                <td><span class="score-badge score-${a.level.toLowerCase()}">${a.level}</span></td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-icon" onclick="viewAnalysis(${a.id})" title="View">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button class="btn-icon" onclick="deleteAnalysis(${a.id})" title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            container.innerHTML = table;
        }

        async function viewAnalysis(id) {
            // In a full implementation, this would show a modal with details
            alert(`Viewing analysis ${id}`);
        }

        async function deleteAnalysis(id) {
            if (!confirm('Are you sure you want to delete this analysis?')) {
                return;
            }

            try {
                const response = await fetch(`/api/history/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadHistory(); // Reload
                } else {
                    alert('Failed to delete analysis');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete analysis');
            }
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            window.location.href = '/api/export/history';
        });

        // Load on page load
        loadHistory();
    </script>
</body>
</html>
