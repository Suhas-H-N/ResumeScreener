<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="jobs">

<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></a>
    <div class="nav-links">
      <a href="/">Analyze</a>
      <a href="/compare-page">Compare</a>
      <a href="/history-page">History</a>
      <a href="/jobs-page" class="active">Jobs</a>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="btn-ghost" id="userMenuButton">
          <i class="fas fa-user-circle"></i><span id="userName">Me</span>
        </button>
        <div class="dropdown-menu" id="userDropdown">
          <a href="/profile-page"><i class="fas fa-user"></i> Profile</a>
          <div class="dropdown-divider"></div>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
      </div>
      <a href="/login-page" class="btn-primary" id="loginLink">Sign In</a>
      <button id="themeToggle" style="background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 9px;color:white;cursor:pointer;">🌙</button>
    </div>
  </div>
</nav>

<div class="main-content">
  <div class="container" style="max-width:1280px;">

    <!-- Header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div>
        <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:4px;">Job Application Tracker</h1>
        <p style="color:var(--slate-light);font-size:0.9rem;">Track every application from saved to accepted — all synced to your account.</p>
      </div>
      <button class="btn btn-primary" id="addJobBtn"><i class="fas fa-plus"></i> Add Job</button>
    </div>

    <!-- Summary cards -->
    <div class="insight-row" id="jobSummary" style="margin-bottom:1.5rem;"></div>

    <!-- Filter bar -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="saved">🔖 Saved</button>
      <button class="filter-btn" data-status="applied">📨 Applied</button>
      <button class="filter-btn" data-status="phone_screen">📞 Phone Screen</button>
      <button class="filter-btn" data-status="interview">💼 Interview</button>
      <button class="filter-btn" data-status="offer">🎉 Offer</button>
      <button class="filter-btn" data-status="accepted">✅ Accepted</button>
      <button class="filter-btn" data-status="rejected">❌ Rejected</button>
    </div>

    <!-- Kanban board -->
    <div id="jobsContent">
      <div style="text-align:center;padding:3rem;color:var(--slate-light);">
        <i class="fas fa-spinner fa-spin" style="font-size:1.5rem;"></i>
      </div>
    </div>

  </div>
</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="jobModal">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <span class="modal-title"><i class="fas fa-briefcase"></i> Job Application</span>
      <button class="modal-close">×</button>
    </div>
    <form id="jobForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field-group" style="grid-column:1/-1;">
          <label class="field-label">Job Title *</label>
          <input type="text" id="jobTitle" class="form-input" placeholder="e.g. Senior Software Engineer" required>
        </div>
        <div class="field-group">
          <label class="field-label">Company *</label>
          <input type="text" id="jobCompany" class="form-input" placeholder="e.g. Google" required>
        </div>
        <div class="field-group">
          <label class="field-label">Location</label>
          <input type="text" id="jobLocation" class="form-input" placeholder="e.g. Remote / NYC">
        </div>
        <div class="field-group">
          <label class="field-label">Job URL</label>
          <input type="url" id="jobUrl" class="form-input" placeholder="https://…">
        </div>
        <div class="field-group">
          <label class="field-label">Salary Range</label>
          <input type="text" id="jobSalary" class="form-input" placeholder="e.g. $120k–$150k">
        </div>
        <div class="field-group">
          <label class="field-label">Status</label>
          <select id="jobStatus" class="form-input">
            <option value="saved">🔖 Saved</option>
            <option value="applied">📨 Applied</option>
            <option value="phone_screen">📞 Phone Screen</option>
            <option value="interview">💼 Interview</option>
            <option value="offer">🎉 Offer</option>
            <option value="accepted">✅ Accepted</option>
            <option value="rejected">❌ Rejected</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Applied Date</label>
          <input type="date" id="jobApplied" class="form-input">
        </div>
        <div class="field-group">
          <label class="field-label">Deadline</label>
          <input type="date" id="jobDeadline" class="form-input">
        </div>
        <div class="field-group" style="grid-column:1/-1;">
          <label class="field-label">Notes</label>
          <textarea id="jobNotes" class="form-textarea" placeholder="Interview feedback, contacts, links…" rows="3"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:1.25rem;flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
        <button type="button" class="btn btn-danger" id="deleteJobBtn" onclick="deleteJob()" style="display:none;"><i class="fas fa-trash"></i> Delete</button>
        <button type="button" class="btn btn-outline" onclick="closeModal('jobModal')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
