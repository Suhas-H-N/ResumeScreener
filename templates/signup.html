<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></div>
        <div class="nav-links">
            <a href="/">Analyze</a>
            <a href="/login-page">Sign In</a>
        </div>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <i class="fas fa-brain"></i>
            <h2>Create Account</h2>
            <p>Start analyzing your resume for free</p>
        </div>

        <div id="errorMessage" style="display:none;background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--radius-md);font-size:0.875rem;margin-bottom:16px;border-left:3px solid var(--danger);"></div>

        <form id="signupForm" onsubmit="return false;">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Jane Smith" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password" required>
            </div>
            <button class="btn-primary btn-large" type="submit">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--slate-light);">
            Already have an account? <a href="/login-page" style="color:var(--gold);font-weight:600;">Sign in</a>
        </div>
    </div>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirmPassword').value;
    const errorEl  = document.getElementById('errorMessage');
    errorEl.style.display = 'none';

    if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
    }

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/';
        } else {
            errorEl.textContent = data.error || 'Registration failed.';
            errorEl.style.display = 'block';
        }
    } catch {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
    }
});
</script>
</body>
</html>
