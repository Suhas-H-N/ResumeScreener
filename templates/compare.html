<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Resumes — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      .compare-layout { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
      @media(max-width:768px){ .compare-layout{grid-template-columns:1fr;} }
      .compare-metric { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:0.875rem; }
      .compare-metric:last-child { border-bottom:none; }
    </style>
</head>
<body data-page="compare">

<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></a>
    <div class="nav-links">
      <a href="/">Analyze</a>
      <a href="/compare-page" class="active">Compare</a>
      <a href="/history-page">History</a>
      <a href="/jobs-page">Jobs</a>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="btn-ghost" id="userMenuButton">
          <i class="fas fa-user-circle"></i><span id="userName">Me</span>
        </button>
        <div class="dropdown-menu" id="userDropdown">
          <a href="/profile-page"><i class="fas fa-user"></i> Profile</a>
          <div class="dropdown-divider"></div>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
      </div>
      <a href="/login-page" class="btn-primary" id="loginLink">Sign In</a>
      <button id="themeToggle" style="background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 9px;color:white;cursor:pointer;">🌙</button>
    </div>
  </div>
</nav>

<div class="main-content">
  <div class="container" style="max-width:1100px;">

    <div style="margin-bottom:1.75rem;">
      <h1 style="font-size:1.6rem;font-weight:700;margin-bottom:4px;">Compare Two Resumes</h1>
      <p style="color:var(--slate-light);font-size:0.9rem;">Side-by-side analysis to determine which resume is a better fit for a role.</p>
    </div>

    <form id="compareForm">
      <!-- Two resume slots -->
      <div class="compare-layout" style="margin-bottom:1.5rem;">

        <!-- Resume A -->
        <div class="form-card">
          <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px;">
            <span style="background:var(--navy);color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;">A</span>
            Resume A
          </h3>
          <div class="upload-area" id="uploadAreaA">
            <div class="upload-placeholder">
              <i class="fas fa-cloud-upload-alt upload-icon"></i>
              <div class="upload-text">Upload Resume A</div>
              <div class="upload-hint">PDF, DOCX, TXT</div>
            </div>
            <div class="file-preview" id="filePreviewA" style="display:none;">
              <i class="fas fa-file-pdf"></i>
              <div class="file-info">
                <div class="file-name" id="fileNameA">—</div>
                <div class="file-size" id="fileSizeA">—</div>
              </div>
              <button type="button" class="btn-remove" id="removeBtnA"><i class="fas fa-times"></i></button>
            </div>
            <input type="file" id="resumeAFile" accept=".pdf,.docx,.doc,.txt" style="display:none;">
          </div>
          <div class="form-divider"><span>or paste</span></div>
          <textarea id="resumeAText" class="form-textarea" placeholder="Paste Resume A text…" rows="6"></textarea>
        </div>

        <!-- Resume B -->
        <div class="form-card">
          <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:8px;">
            <span style="background:var(--gold);color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700;">B</span>
            Resume B
          </h3>
          <div class="upload-area" id="uploadAreaB">
            <div class="upload-placeholder">
              <i class="fas fa-cloud-upload-alt upload-icon"></i>
              <div class="upload-text">Upload Resume B</div>
              <div class="upload-hint">PDF, DOCX, TXT</div>
            </div>
            <div class="file-preview" id="filePreviewB" style="display:none;">
              <i class="fas fa-file-pdf"></i>
              <div class="file-info">
                <div class="file-name" id="fileNameB">—</div>
                <div class="file-size" id="fileSizeB">—</div>
              </div>
              <button type="button" class="btn-remove" id="removeBtnB"><i class="fas fa-times"></i></button>
            </div>
            <input type="file" id="resumeBFile" accept=".pdf,.docx,.doc,.txt" style="display:none;">
          </div>
          <div class="form-divider"><span>or paste</span></div>
          <textarea id="resumeBText" class="form-textarea" placeholder="Paste Resume B text…" rows="6"></textarea>
        </div>
      </div>

      <!-- Job description -->
      <div class="form-card" style="margin-bottom:1.5rem;">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:0.75rem;"><i class="fas fa-briefcase"></i> Job Description</h3>
        <textarea id="compareJobDesc" class="form-textarea" placeholder="Paste the job description to compare against…" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" id="compareBtn" style="width:100%;">
        <i class="fas fa-balance-scale"></i> Compare Resumes
      </button>
    </form>

    <!-- Results -->
    <div id="compareResults" style="display:none;margin-top:2rem;"></div>

  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
