<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — ResumeIQ Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      .profile-avatar { width:72px;height:72px;background:linear-gradient(135deg,var(--navy-soft),var(--navy));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:var(--gold-light);flex-shrink:0; }
      .stat-mini { text-align:center;padding:1rem;background:var(--ivory);border:1px solid var(--border-soft);border-radius:var(--radius-lg); }
      .stat-mini-val { font-size:1.5rem;font-weight:800;font-family:var(--font-mono);color:var(--navy); }
      .stat-mini-lbl { font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate-light);font-weight:700;margin-top:4px; }
    </style>
</head>
<body data-page="profile">

<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-brand"><i class="fas fa-brain"></i><span>ResumeIQ Pro</span></a>
    <div class="nav-links">
      <a href="/">Analyze</a>
      <a href="/compare-page">Compare</a>
      <a href="/history-page">History</a>
      <a href="/jobs-page">Jobs</a>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="btn-ghost" id="userMenuButton">
          <i class="fas fa-user-circle"></i><span id="userName">Me</span>
        </button>
        <div class="dropdown-menu" id="userDropdown">
          <a href="/profile-page"><i class="fas fa-user"></i> Profile</a>
          <div class="dropdown-divider"></div>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
      </div>
      <a href="/login-page" class="btn-primary" id="loginLink">Sign In</a>
      <button id="themeToggle" style="background:none;border:1px solid rgba(255,255,255,0.2);border-radius:6px;padding:5px 9px;color:white;cursor:pointer;">🌙</button>
    </div>
  </div>
</nav>

<div class="main-content">
  <div class="container" style="max-width:800px;">

    <!-- Profile header -->
    <div style="display:flex;align-items:center;gap:1.25rem;margin-bottom:2rem;padding:1.5rem;background:white;border:1px solid var(--border-soft);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:700;" id="profileNameDisplay">—</h1>
        <p style="color:var(--slate-light);font-size:0.875rem;" id="profileEmailDisplay">—</p>
      </div>
    </div>

    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;">
      <div class="stat-mini"><div class="stat-mini-val" id="statTotal">—</div><div class="stat-mini-lbl">Analyses</div></div>
      <div class="stat-mini"><div class="stat-mini-val" id="statAvg">—</div><div class="stat-mini-lbl">Avg Match</div></div>
      <div class="stat-mini"><div class="stat-mini-val" id="statAts">—</div><div class="stat-mini-lbl">Avg ATS</div></div>
      <div class="stat-mini"><div class="stat-mini-val" id="statBest">—</div><div class="stat-mini-lbl">Best Score</div></div>
    </div>

    <!-- Tabs -->
    <div id="profileTabs">
      <div class="tab-bar">
        <button class="tab-btn" data-tab="tabInfo">Profile</button>
        <button class="tab-btn" data-tab="tabSecurity">Security</button>
        <button class="tab-btn" data-tab="tabDanger">Danger Zone</button>
      </div>

      <!-- Profile info -->
      <div class="tab-pane results-card" id="tabInfo">
        <h3 style="margin-bottom:1.25rem;">Personal Information</h3>
        <form id="profileForm">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="field-group">
              <label class="field-label">Full Name *</label>
              <input type="text" id="profileName" class="form-input" required>
            </div>
            <div class="field-group">
              <label class="field-label">Email</label>
              <input type="email" id="profileEmail" class="form-input" disabled
                     style="opacity:0.6;cursor:not-allowed;" title="Email cannot be changed">
            </div>
            <div class="field-group">
              <label class="field-label">Company / Organisation</label>
              <input type="text" id="profileCompany" class="form-input" placeholder="Where you work">
            </div>
            <div class="field-group">
              <label class="field-label">Current Role</label>
              <input type="text" id="profileRole" class="form-input" placeholder="e.g. Software Engineer">
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:1rem;"><i class="fas fa-save"></i> Save Changes</button>
        </form>
      </div>

      <!-- Security -->
      <div class="tab-pane results-card" id="tabSecurity">
        <h3 style="margin-bottom:1.25rem;">Change Password</h3>
        <form id="passwordForm" style="max-width:480px;">
          <div class="field-group">
            <label class="field-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-input" required autocomplete="current-password">
          </div>
          <div class="field-group">
            <label class="field-label">New Password</label>
            <input type="password" id="newPassword" class="form-input" required minlength="8" autocomplete="new-password">
          </div>
          <div class="field-group">
            <label class="field-label">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-input" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-lock"></i> Update Password</button>
        </form>
      </div>

      <!-- Danger -->
      <div class="tab-pane results-card" id="tabDanger">
        <h3 style="margin-bottom:0.5rem;color:#dc2626;">Danger Zone</h3>
        <p style="font-size:0.875rem;color:var(--slate-light);margin-bottom:1.25rem;">
          Deleting your account is permanent. All analyses, comparisons, and job applications will be erased.
        </p>
        <button class="btn btn-danger" id="deleteAccountBtn"><i class="fas fa-trash-alt"></i> Delete My Account</button>
      </div>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
